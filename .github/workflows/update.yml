name: Update feed

on:
  schedule:
    - cron: "*/15 * * * *"        # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:
    inputs:
      recheck:
        description: Re-check the last 48 hours against criteria.md
        type: boolean
        default: false
  push:
    paths: [criteria.md, config.yml, filter.py]

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25           # the backfill uses up to 10 minutes of each run
    permissions:
      contents: write
      pages: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it is now, not as it was when this run was queued: a run that
          # waited behind another must start from the state that run saved.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the trades
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECHECK: ${{ inputs.recheck }}
        run: python filter.py

      - name: Save what changed
        id: save
        if: ${{ !cancelled() }}
        run: |
          git add -A docs state.json
          git add -A backfill.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update feed"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true  # never leave half-merged files behind
            sleep 5
          done
          echo "::error title=Couldn't save::Another update was saved first and this run's changes clash with it. Nothing from this run was saved or published; the next run carries on."
          exit 1

      # Publishes when something changed, on manual runs, or if the page isn't live yet.
      # Never after a failed save: the page must match what's saved.
      - name: Decide whether to publish
        id: decide
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.save.outputs.changed }}
          EVENT: ${{ github.event_name }}
        run: |
          info=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null || true)
          if [ "$(jq -r '.build_type // empty' <<<"$info" 2>/dev/null)" != "workflow" ]; then
            echo "::warning title=Page not published yet::In Settings > Pages, set Source to GitHub Actions. Filtering keeps running meanwhile; the page publishes on the next run after that."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          publish=false
          if [ "$CHANGED" = "true" ] || [ "$EVENT" != "schedule" ]; then publish=true; fi
          url=$(jq -r '.html_url' <<<"$info")
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "${url%/}/feed.xml" || true)" != "200" ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Package the page
        if: ${{ !cancelled() && steps.decide.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  publish:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
